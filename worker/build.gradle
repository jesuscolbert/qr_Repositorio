plugins { id 'com.android.application' }
android {
 namespace 'bo.colbert.obrero'
 compileSdk 35
 defaultConfig { applicationId 'bo.colbert.obrero'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 def signingFile=rootProject.file('private/signing.properties')
 if(signingFile.exists()) {def props=new Properties();signingFile.withInputStream {props.load(it)};signingConfigs {localRelease {storeFile rootProject.file('private/release.jks');storePassword props['storePassword'];keyAlias 'comedor';keyPassword props['keyPassword']}}}
 buildTypes {release {minifyEnabled true;shrinkResources true;proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro';if(signingFile.exists())signingConfig signingConfigs.localRelease}}
 compileOptions {sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
}
dependencies {
 implementation project(':credential')
 implementation 'androidx.core:core:1.13.1'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 implementation 'com.google.zxing:core:3.5.3'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
