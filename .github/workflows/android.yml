name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, soboce-comedor]
    paths: ['app/**', 'worker/**', 'credential/**', 'billing/**', 'licensing/**', 'backend/**', 'tests/**', 'scripts/**', '*.gradle', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'worker/**', 'credential/**', 'billing/**', 'licensing/**', 'backend/**', 'tests/**', 'scripts/**', '*.gradle', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          ref: 2026.10.6
          path: .tools/cloudflared-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tools/cloudflared-source/go.mod
          cache-dependency-path: .tools/cloudflared-source/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar firma estable sin incluirla en el repositorio
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SOBOCE_SIGNING_KEYSTORE_B64 }}
          PROPERTIES_B64: ${{ secrets.SOBOCE_SIGNING_PROPERTIES_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          target = pathlib.Path('private')
          target.mkdir(exist_ok=True)
          for variable, name in [('KEYSTORE_B64', 'release.jks'), ('PROPERTIES_B64', 'signing.properties')]:
              value = os.environ.get(variable, '')
              if not value:
                  raise SystemExit('Falta configurar la firma estable en GitHub Secrets.')
              (target / name).write_bytes(base64.b64decode(value, validate=True))
          PY
      - run: node --test tests/backend.test.cjs tests/lease.test.mjs tests/wallet.test.mjs
      - name: Probar cliente de licencias para escritorio
        run: |
          python3 -m pip install cryptography openpyxl zxing-cpp==3.0.0 Pillow
          python3 -m unittest discover -s tests -p test_desktop_license.py -v
          python3 -m unittest discover -s tests -p test_frigor_roster.py -v
      - name: Probar decisiones entre cuatro teléfonos
        run: |
          mkdir -p .tools/quorum-tests
          javac -d .tools/quorum-tests app/src/main/java/bo/soboce/comedor/QuorumLog.java tests/QuorumLogTest.java
          java -cp .tools/quorum-tests bo.soboce.comedor.QuorumLogTest
      - name: Compilar conector de túnel para Android
        run: bash scripts/build_cloudflared.sh
      - run: gradle :app:assemblePilot :app:lintPilot :app:assembleFrigor :app:lintFrigor :billing:assembleRelease :billing:lintRelease :licensing:assembleRelease :licensing:lintRelease :worker:assembleRelease :worker:lintRelease --console=plain
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar conexión privada para prueba real del túnel
        if: github.event_name != 'pull_request'
        env:
          SHARED_TEST_B64: ${{ secrets.SOBOCE_SHARED_TEST_CONFIG_B64 }}
          FRIGOR_TEST_B64: ${{ secrets.FRIGOR_SHARED_TEST_CONFIG_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('FRIGOR_TEST_B64', '') or os.environ.get('SHARED_TEST_B64', '')
          if value:
              target = pathlib.Path('app/src/androidTest/assets/shared-live-test.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Preparar validación inicial del nuevo túnel de cobros
        if: github.event_name != 'pull_request'
        env:
          BILLING_TEST_B64: ${{ secrets.COLBERT_BILLING_LIVE_TEST_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('BILLING_TEST_B64', '')
          if value:
              target = pathlib.Path('billing/src/androidTest/assets/billing-live-test.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(value, validate=True))
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p app/build/reports/ui
            gradle :app:connectedDebugAndroidTest --console=plain || { adb pull /sdcard/Download/soboce-design app/build/reports/ui/; mkdir -p app/build/reports/pdf; adb pull /sdcard/Download/soboce-pdf app/build/reports/pdf/; exit 1; }
            mkdir -p app/build/reports/pdf
            adb pull /sdcard/Download/soboce-pdf app/build/reports/pdf/
            python3 tests/check_qr_pdf.py app/build/reports/pdf/soboce-pdf
            gradle :billing:connectedDebugAndroidTest :licensing:connectedDebugAndroidTest --console=plain || { adb pull /sdcard/Download/colbert-billing-design app/build/reports/ui/; exit 1; }
            gradle :worker:connectedDebugAndroidTest --console=plain || { adb pull /sdcard/Download/worker-design app/build/reports/ui/; exit 1; }
            adb pull /sdcard/Download/worker-design app/build/reports/ui/
            mkdir -p app/build/reports/excel
            adb pull /sdcard/Download/soboce-excel app/build/reports/excel/
            python3 tests/check_excel_export.py app/build/reports/excel/soboce-excel/consumos-demo.xlsx
            python3 tests/probe_release_reports.py app/build/outputs/apk/pilot/app-pilot.apk
            adb install -r app/build/outputs/apk/pilot/app-pilot.apk
            adb shell am start -W -n bo.soboce.comedor.piloto/bo.soboce.comedor.MainActivity
            adb install -r app/build/outputs/apk/frigor/app-frigor.apk
            adb shell am start -W -n bo.soboce.comedor.frigor/bo.soboce.comedor.MainActivity
            mkdir -p app/build/reports/ui
            adb exec-out screencap -p > app/build/reports/ui/conexion.png
            adb pull /sdcard/Download/soboce-design app/build/reports/ui/
            adb pull /sdcard/Download/colbert-billing-design app/build/reports/ui/
            mkdir -p app/build/reports/pdf
            adb pull /sdcard/Download/soboce-pdf app/build/reports/pdf/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOBOCE-Comedor-validacion
          path: |
            app/build/reports/androidTests/
            app/build/reports/ui/
            app/build/reports/pdf/
            app/build/reports/excel/
            app/build/reports/release-probe/result.json
            billing/build/reports/androidTests/
            licensing/build/reports/androidTests/
            worker/build/reports/androidTests/
            worker/build/reports/lint-results-*
            app/build/reports/lint-results-*
            billing/build/reports/lint-results-*
            licensing/build/reports/lint-results-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SOBOCE-Comedor-prueba
          path: app/build/outputs/apk/pilot/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FRIGOR-Comedor-prueba
          path: app/build/outputs/apk/frigor/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Colbert-Cobros-servidor
          path: billing/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Colbert-Licencias-SDK
          path: |
            licensing/build/outputs/aar/*release.aar
            licensing/desktop/colbert_license.py
            licensing/README.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mi-Comedor-Obrero
          path: worker/build/outputs/apk/release/*.apk
          if-no-files-found: error
