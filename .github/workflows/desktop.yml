name: Compilar visor Windows
on:
  workflow_dispatch:
  push:
    branches: [soboce-comedor]
    paths: ['desktop/**', 'licensing/desktop/**', 'tests/test_reports_desktop.py', 'tests/test_executive_excel.py', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0 cryptography==46.0.3 pillow==12.0.0
      - run: python -m unittest discover -s tests -p test_reports_desktop.py -v
      - run: python -m unittest discover -s tests -p test_executive_excel.py -v
      - run: python -m unittest discover -s tests -p test_desktop_license.py -v
      - name: Compilar ejecutable sin credenciales privadas
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name Colbert-Reportes --paths licensing/desktop --paths desktop --hidden-import PIL.ImageGrab desktop/main.py
      - name: Probar ejecutable con configuración ficticia
        shell: python
        run: |
          import sys, pathlib, subprocess, json
          sys.path[:0]=['desktop','tests','licensing/desktop']
          from configuration import append
          from test_reports_desktop import config
          append('dist/Colbert-Reportes.exe','dist/prueba.exe',config())
          subprocess.run(['dist/prueba.exe','--self-test','dist/self-test.json'],check=True,timeout=90)
          assert json.loads(pathlib.Path('dist/self-test.json').read_text())['ok']
          subprocess.run(['dist/prueba.exe','--demo-screenshot','dist/visor-demostracion.png'],check=True,timeout=90)
          assert pathlib.Path('dist/visor-demostracion.png').stat().st_size>10000
          pathlib.Path('dist/prueba.exe').unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: Colbert-Reportes-Windows
          path: dist/
          if-no-files-found: error
